<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("crm-theme");
          if (!theme) {
            theme = JSON.parse(localStorage.getItem("myKey") || "false")
              ? "dark"
              : "light";
          }
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.dataset.sidebar =
            localStorage.getItem("crm-sidebar") === "collapsed"
              ? "collapsed"
              : "expanded";
        } catch (e) {}
      })();
    </script>
    <title>Bizda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
